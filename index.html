<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{(function(){var t=localStorage.getItem('ls_theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');})();}catch(e){}</script>
<title>LiveSight</title>
<link rel="icon" href="assets/icons/logo-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="splash" id="splash">
  <div class="center">
    <div class="radar-wrap">
      <span class="radar-ring r1"></span>
      <span class="radar-ring r2"></span>
      <span class="radar-ring r3"></span>
      <span class="radar-ring r4"></span>
      <span class="radar-sweep"></span>
      <div class="radar-core">
        <img src="assets/img/logo.png" alt="LiveSight">
        <span class="blip b1"></span><span class="blip b2"></span><span class="blip b3"></span>
      </div>
    </div>
    <div class="brand-tag"><b>Live</b>Sight</div>
    <div class="tagline" data-i18n="tagline"></div>
  </div>
</div>
<script src="assets/js/i18n.js"></script>
<script>
  I18n.apply();
  setTimeout(()=>{
    const sp=document.getElementById('splash');
    sp.classList.add('hide');
    setTimeout(()=>{ location.href='login.html'; }, 620);
  }, 2300);
</script>
</body>
</html>
